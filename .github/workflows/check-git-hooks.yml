name: check-git-hooks

# Runs the global git hooks' own checks through mise: scripts/check-dash-gate.py
# is the dash gate's block/pass matrix, and scripts/check-hook-knobs.py asserts
# no hook honors a bypass knob and none advertises one. The fish cases compile
# tree-sitter-fish on first use, which needs the runner's cc and network.

on:
  push:
    branches: [main]
    paths:
      - '.config/git/hooks/pre-commit'
      - '.config/git/hooks/commit-msg'
      - '.config/git/hooks/pre-push'
      - '.config/git/hooks/dash-gate.py'
      - '.config/git/hooks/abs-path-gate.py'
      - 'scripts/check-dash-gate.py'
      - 'scripts/check-hook-knobs.py'
      - '.mise.toml'
      - '.github/workflows/check-git-hooks.yml'
  pull_request:
    paths:
      - '.config/git/hooks/pre-commit'
      - '.config/git/hooks/commit-msg'
      - '.config/git/hooks/pre-push'
      - '.config/git/hooks/dash-gate.py'
      - '.config/git/hooks/abs-path-gate.py'
      - 'scripts/check-dash-gate.py'
      - 'scripts/check-hook-knobs.py'
      - '.mise.toml'
      - '.github/workflows/check-git-hooks.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config.toml
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run check-dash-gate
      - run: mise run check-hook-knobs