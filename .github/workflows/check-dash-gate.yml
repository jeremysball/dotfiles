name: check-dash-gate

# Runs scripts/check-dash-gate.py through `mise run check-dash-gate`: the real
# pre-commit hook over real staged diffs in scratch repos. The fish cases
# compile tree-sitter-fish on first use, which needs the runner's cc and network.

on:
  push:
    branches: [main]
    paths:
      - '.config/git/hooks/pre-commit'
      - '.config/git/hooks/dash-gate.py'
      - 'scripts/check-dash-gate.py'
      - '.mise.toml'
      - '.github/workflows/check-dash-gate.yml'
  pull_request:
    paths:
      - '.config/git/hooks/pre-commit'
      - '.config/git/hooks/dash-gate.py'
      - 'scripts/check-dash-gate.py'
      - '.mise.toml'
      - '.github/workflows/check-dash-gate.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config.toml
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run check-dash-gate
