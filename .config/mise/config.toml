# Global mise config, symlinked to ~/.config/mise/config.toml by mise's own
# dotfiles feature (see the [dotfiles] table below).
#
# Scope: everything user-space. Pacman keeps only system packages and the
# two exceptions noted below.
#
# Deliberately NOT here:
#   fish     - login shell, must live in /etc/shells
#   ripgrep  - hard dependency of the pacman `opencode` package
#   opencode - pulls ripgrep with it; the two move together or not at all
#   grc      - ships /etc/grc.fish, which config.fish sources by absolute path
#   ghc/cabal/hls - ghcup already manages these well, and manages six GHC
#                   versions side by side. mise installs ghcup, not the toolchain.
#   ttf-nerd-fonts-symbols-mono, discount, texlive-plaingeneric, ispell - Doom
#     Emacs deps with no mise backend at all (fonts, a TeX Live package group,
#     a non-registry CLI, a spell checker). Reproduce via `mise-sys
#     doom-emacs-extras`.
#
# Install/bootstrap tasks (install-secrets, install-dotclaude,
# install-serper-axi, secrets-sync, etc.) live in the separate
# jeremysball/mise-en-system repo, not in this file's [tasks] table -- this
# config is loaded globally by mise (required so [tools] lands on PATH from
# any directory), and a global [tasks] table would leak into every other
# project's `mise tasks`. Run them with `mise-sys <task>` (a fish function
# wrapping `mise -C ~/projects/mise-en-system run <task>`) or `mise -C
# ~/projects/mise-en-system run <task>` directly. For secret updates use
# `mise-sys secrets-sync` (pulls both repos and re-links), not re-running
# `install-secrets` which only clones.
#
# Exception: install-worktree-githooks lives here intentionally so `mise run
# install-worktree-githooks` is globally available from any directory without
# the `mise-sys` wrapper — you want it on every machine after dotfiles apply.

[tools]
# core CLI, referenced by fish abbrs and aliases
eza    = "latest"
bat    = "latest"
fd     = "latest"
zoxide = "latest"
fzf    = "latest"
jq     = "latest"
yq     = "latest"

# editors
neovim = "latest"

# git
gh      = "latest"
lazygit = "latest"
delta   = "latest"

# runtimes. Pin these per machine in ~/.config/mise/conf.d/ if they need to differ.
node   = "latest"
# bun: pinned because scripts/sync-fleet-skills.sh uses it to read the
# kilo/opencode JSONC configs. Bun parses comments and trailing commas
# natively (`require("x.jsonc")`), which jq and node cannot, and the
# alternative was hand-rolling a JSONC parser inside a shell script.
bun    = "latest"
go     = "latest"
python = "latest"
uv     = "latest"

# llm shell pipe tool. Not in mise's registry under a bare `mods` name, so
# the aqua backend is named explicitly.
"aqua:charmbracelet/mods" = "latest"

# charmbracelet gum — beautiful shell scripts (gum style/spin/log) used by init.sh
# when available; init.sh falls back to plain echo if not yet installed (fresh machine).
gum = "latest"

# haskell: manage the manager, not the toolchain
ghcup = "latest"

# mise's own shell-completion generator; without it mise prints a warning
# that completions won't work
usage = "latest"

# generic multi-shell completion generator; provides fish completions for
# hundreds of CLIs that don't ship their own
carapace = "latest"

# fun — fortune feeds fish_greeting, cowsay/catbow decorate it
cowsay = "latest"
# catbow — installed from source via go: backend so the binary is `catbow`
# (the github release asset is `cb-v1.0.1-linux-amd64.tar.gz` containing a
# binary named `cb`, not `catbow`, so the github backend installs `cb` and
# `mise which catbow` fails with "No executable found"). Using go: builds
# from github.com/jeremysball/catbow and produces the correct `catbow` name.
"go:github.com/jeremysball/catbow" = "latest"

# AUR helper — not in Arch's official repos, so `sudo pacman -S yay` would
# fail. Mise pulls the prebuilt binary from GitHub releases (Jguer/yay) with
# no build step, matching how other prebuilt tools are managed here.
"github:Jguer/yay" = "latest"
rust = "1.91"
ast-grep = "0.44.1"
"pipx:huggingface_hub" = "latest"

# colabctl was a stray `pip install` into the shared python@latest venv,
# so its shim only resolved from directories where that happened to be the
# active python version. pipx backend isolates it the same way as
# huggingface_hub above, making the shim version-independent. `all` extra
# matches what the stray install effectively had (cli/drive/native/mcp/etc
# were all importable), so nothing regresses vs the ad hoc install it replaces.
# jupyter-kernel-client pinned below 1.0: google-colab-cli 0.6.0 (colabctl's
# `cli` extra) imports jupyter_kernel_client.KernelClient, which 1.0.0
# renamed to JupyterKernelClient, breaking `colabctl exec` with
# `AttributeError: module 'jupyter_kernel_client' has no attribute
# 'KernelClient'`. 0.9.0 is the last release with the old name.
"pipx:colabctl" = { version = "latest", extras = ["all"], uvx_args = "--with jupyter-kernel-client==0.9.0" }

# `colab` (the underlying binary colabctl's default transport shells out to)
# had no mise-tracked shim of its own, so PATH resolution fell through to
# whatever else claimed the name first, an unrelated npm package `colab-cli`
# (AWS/Redis commands, nothing to do with Colab) that was shadowing it. This
# installs the real PyPI `google-colab-cli` package directly so `colab`
# resolves deterministically without a `--colab-bin` override. Same
# jupyter-kernel-client pin as colabctl above: this package hits the exact
# same `KernelClient` rename break on its own `colab exec`/kernel commands.
"pipx:google-colab-cli" = { version = "latest", uvx_args = "--with jupyter-kernel-client==0.9.0" }

[settings]
# Read .nvmrc / .python-version / .go-version in repos that never heard of mise
idiomatic_version_file_enable_tools = ["node", "python", "go"]
experimental = true

# The mise-en-system repo (see the [tasks] header comment above). Declaring
# it here lets `mise bootstrap repos apply` clone/converge it instead of
# init.sh hand-rolling clone-or-pull: mise clones it if missing and pulls
# only when the checkout is clean and origin matches, leaving a dirty or
# diverged checkout alone rather than failing the whole bootstrap.
[bootstrap.repos]
"~/projects/mise-en-system" = { url = "https://github.com/jeremysball/mise-en-system.git" }

# Every file this repo manages, symlinked from ~/.dotfiles (the default
# dotfiles.root) into place by `mise bootstrap dotfiles apply`. Every entry
# is one of:
#   - a single file (mode omitted, the default `symlink`)
#   - `mode = "symlink-each"`, for a directory a runtime tool writes into
#     (fisher/tide in fish/functions, fish/conf.d, fish/completions; also
#     .local/bin, since a few of those scripts are dangling symlinks that
#     only resolve on specific machines -- see below). It symlinks only the
#     files that exist in the repo's copy of the directory, so anything a
#     tool writes straight into the live directory is left alone, and a
#     source that doesn't resolve on this machine is skipped rather than
#     failing the whole apply the way a plain `= {}` entry would.
#   - `mode = "symlink"` on a whole directory, for the four git submodules
#     (alacritty-theme, zsh-autosuggestions, zsh-syntax-highlighting,
#     powerlevel10k), since nothing writes into an external theme/plugin
#     checkout at runtime. Submodules aren't checked out by a plain
#     `git clone` though -- run `git submodule update --init --recursive`
#     first (init.sh does this for you), or those four entries symlink
#     empty directories.
#
# A machine that does not want a given target (the graphical-workstation
# section below, for instance) just does not need those entries applied --
# either strip them locally before applying, or leave them: an unapplied
# entry with no source machine state does nothing until you `mise bootstrap
# dotfiles add` it for real.
[dotfiles]
# fish. completions/conf.d/functions use symlink-each: it symlinks only the
# files that exist in the repo's copy of each directory, so a file fisher or
# tide writes directly into the live directory (never into the repo) is left
# alone untouched. Same guarantee as one entry per file, far fewer lines, and
# a new file added to one of these three directories is picked up on the next
# apply without an extra table edit.
"~/.config/fish/completions" = { mode = "symlink-each" }
"~/.config/fish/conf.d" = { mode = "symlink-each" }
"~/.config/fish/functions" = { mode = "symlink-each" }
"~/.config/fish/config.fish" = {}
"~/.config/fish/fish_plugins" = {}

# mise (this file too)
"~/.config/mise/config.toml" = {}

# nvim
"~/.config/nvim/.gitignore" = {}
"~/.config/nvim/.neoconf.json" = {}
"~/.config/nvim/LICENSE" = {}
"~/.config/nvim/README.md" = {}
"~/.config/nvim/init.lua" = {}
"~/.config/nvim/lazy-lock.json" = {}
"~/.config/nvim/lazyvim.json" = {}
"~/.config/nvim/lua/config/autocmds.lua" = {}
"~/.config/nvim/lua/config/keymaps.lua" = {}
"~/.config/nvim/lua/config/lazy.lua" = {}
"~/.config/nvim/lua/config/options.lua" = {}
"~/.config/nvim/lua/plugins/99.lua" = {}
"~/.config/nvim/lua/plugins/example.lua" = {}
"~/.config/nvim/stylua.toml" = {}

# doom
"~/.config/doom/config.el" = {}
"~/.config/doom/init.el" = {}
"~/.config/doom/packages.el" = {}

# bin scripts. symlink-each also means gf2/libregate/pico8/speedcat (dangling
# symlinks to tool paths that only exist on the machine that has those
# tools -- see the [dotfiles] header comment) are silently skipped on a
# machine that doesn't have them, instead of failing the whole apply the way
# an individual `= {}` entry does.
"~/.local/bin" = { mode = "symlink-each" }

# fonts. MonoLisaNerdFontMono-Regular.otf is the patched terminal/editor font
# itself, not a fontconfig setting -- reproduce or refresh it via
# `mise-sys monolisa-nerd-font-patch`.
"~/.config/fontconfig/fonts.conf" = {}
"~/.local/share/fonts/MonoLisaNerdFontMono-Regular.otf" = {}

# bash
"~/.bashrc" = {}

# git
"~/.config/git/ignore" = {}
"~/.gitconfig" = {}

# gh
"~/.config/gh/config.yml" = {}
"~/.config/gh/pat-switcher.sh" = {}

# systemd
"~/.config/systemd/user/bumblebee-nightly.service" = {}
"~/.config/systemd/user/bumblebee-nightly.timer" = {}
"~/.config/systemd/user/bifrost.service" = {}
"~/.config/systemd/user/mise-upgrade.service" = {}
"~/.config/systemd/user/mise-upgrade.timer" = {}

# zellij, htop, superfile, himalaya, alfred, taskferry, mcporter
"~/.config/alfred/config.toml" = {}
"~/.config/himalaya/config.toml" = {}
"~/.config/htop/htoprc" = {}
"~/.config/mcporter/config.json" = {}
"~/.config/superfile/compact.toml" = {}
"~/.config/superfile/config.toml" = {}
"~/.config/superfile/hotkeys.toml" = {}
"~/.config/taskferry/config.json" = {}
"~/.config/zellij/config.kdl" = {}

# pi agent (absorbed from jeremysball/pi-mono 2026-08-30). symlink-each
# recurses and symlinks per-file, so runtime state pi writes into ~/.pi
# (sessions/, auth.json, models-store.json — all gitignored in
# .pi/.gitignore) stays local and never reaches the repo. settings.json and
# models.json are tracked (live config, not runtime state) and symlink in.
"~/.pi" = { mode = "symlink-each" }

# older graphical workstation: i3, xorg, picom, alacritty, helix, zsh, tmux
"~/.config/alacritty/alacritty-theme" = {}  # submodule, whole-dir symlink
"~/.config/alacritty/alacritty.toml" = {}
"~/.config/helix/config.toml" = {}
"~/.config/helix/ignore" = {}
"~/.config/helix/languages.toml" = {}
"~/.config/i3/config" = {}
"~/.config/picom.conf" = {}
"~/.tmux.conf" = {}
"~/.xinitrc" = {}
"~/.xprofile" = {}
"~/.zsh/aliases" = {}
"~/.zsh/custom/plugins/zsh-autosuggestions" = {}  # submodule, whole-dir symlink
"~/.zsh/custom/plugins/zsh-syntax-highlighting" = {}  # submodule, whole-dir symlink
"~/.zsh/custom/themes/linuxonly-purple.zsh-theme" = {}
"~/.zsh/custom/themes/powerlevel10k" = {}  # submodule, whole-dir symlink
"~/.zsh/functions/e" = {}
"~/.zsh/functions/edit.sh" = {}
"~/.zshrc" = {}
"~/.zshrc.local" = {}

# haskell (cabal, ghcup config -- the ghc toolchain itself stays unmanaged
# per the [tools] header comment, ghcup owns it)
"~/.config/cabal/config" = {}
"~/.config/ghcup/config.yaml" = {}

# bumblebee-nightly (config only; the systemd service/timer pair is tracked
# above alongside bumblebee-nightly.{service,timer})
"~/.config/bumblebee-nightly/config" = {}

# bifrost -- config.json only. The unit is tracked above alongside
# bifrost.service. Lives under ~/.local/state because the app also writes
# its own sqlite state/log databases into the same directory; the env file
# with the actual provider keys is never tracked here, regenerate it via
# `mise-sys install-bifrost`, which pulls from global.env.
"~/.local/state/bifrost/config.json" = {}

# herdr -- config.toml only. herdr-client.log, herdr-server.log,
# session.json, release-notes.json are runtime state, not config, and
# deliberately not tracked here.
"~/.config/herdr/config.toml" = {}

# mods
"~/.config/mods/mods.yml" = {}

# playwright-mcp
"~/.config/playwright-mcp/config.json" = {}

# tmux -- local override layered on ~/.tmux.conf above
"~/.config/tmux/tmux.conf.local" = {}

# git -- global hooks, wired via [core] hooksPath in .gitconfig. Tracked
# here so every machine that runs `mise bootstrap dotfiles apply` gets the
# pre-commit (adhd-theme guardrail + dash gate: em and en dashes plus
# double-hyphen stand-ins), the commit-msg (AI-credit refusal + Conventional
# Commits subject), and the pre-push (open-worktree budget)
# with zero manual setup.
"~/.config/git/hooks/pre-commit" = {}
"~/.config/git/hooks/commit-msg" = {}
"~/.config/git/hooks/pre-push" = {}

# opencode -- config only. meta-api-key is a live credential; node_modules,
# package.json/package-lock.json are installed deps; backups-2026-07-17/ is
# a stale snapshot. None of those four are tracked.
"~/.config/opencode/opencode.json" = {}
"~/.config/opencode/opencode.jsonc" = {}
"~/.config/opencode/tui.json" = {}
"~/.config/opencode/agent/hermes.md" = {}
"~/.config/opencode/agents/notools-luna.md" = {}
"~/.config/opencode/agents/notools-sol.md" = {}
"~/.config/opencode/agents/notools-terra.md" = {}
"~/.config/opencode/plugins/herdr-agent-state.js" = {}
# adhd theme. Tracked here (not in the designing-for-adhd skill repo) so
# `mise bootstrap dotfiles apply` recreates the symlink on fresh machines
# without needing ~/.claude/skills/designing-for-adhd to be cloned. Keep
# in sync with ~/.claude/skills/designing-for-adhd/references/theme-adhd.json
# (the canonical source). scripts/check-adhd-themes.sh flags drift in both
# the file and the tui.json selection.
"~/.config/opencode/themes/adhd.json" = {}

# kilo -- its own kilo.jsonc exposes claude-code plugin skills via skills.paths
"~/.config/kilo/kilo.jsonc" = {}
# tui.json selects the theme; without it kilo falls back to the default
# palette (this file was missing entirely, which is why kilo kept losing
# the adhd theme). Must stay "theme": "adhd" -- check-adhd-themes.sh enforces.
"~/.config/kilo/tui.json" = {}
# adhd theme (mirror of the opencode one above, same source/sync caveat).
"~/.config/kilo/themes/adhd.json" = {}

[tasks.check-adhd-themes]
# The recurring breakage: kilo and opencode keep falling back to their
# default palette because the adhd theme file goes missing OR stops being
# selected in tui.json. Validates both, for both tools: the theme JSON
# exists + is a valid opencode theme, and .config/{kilo,opencode}/tui.json
# has "theme": "adhd". Alert-only (exits 1 with the exact broken path);
# the [dotfiles] table auto-repairs the symlinks on `mise bootstrap dotfiles
# apply`. The same check runs in --tracked-only mode from the global
# pre-commit hook and CI, so a theme regression can't be committed.
description = "Verify the adhd theme is present and selected for kilo + opencode (theme file valid + tui.json theme=adhd). Alerts only; exits 1 with the broken path. The [dotfiles] table auto-heals the symlinks on apply."
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Defined in the global [tasks] table but the script is a tracked file in
# the dotfiles repo; resolve from the dotfiles root (init.sh exports
# MISE_DOTFILES_ROOT) so the task survives unapply/reapply and worktrees.
DOTFILES_ROOT="${MISE_DOTFILES_ROOT:-${DOTFILES_ROOT:-$HOME/.dotfiles}}"
SCRIPT="$DOTFILES_ROOT/scripts/check-adhd-themes.sh"

if [ ! -f "$SCRIPT" ]; then
    echo "check-adhd-themes: $SCRIPT not found. Run \`mise bootstrap dotfiles apply\` first." >&2
    exit 1
fi

exec "$SCRIPT" "$@"
'''

[tasks.sync-fleet-skills]
# The recurring breakage: plugin skills live behind a version directory
# (~/.claude/plugins/cache/.../superpowers/6.3.0/skills), so every plugin
# update silently dangles anything that named the old path. That is how
# ~/.config/opencode/skills/ reached 25 dead links out of 29 and opencode
# ended up loading 1 of 14 superpowers skills. This rewrites the stable
# ~/.claude/fleet-skills/ directory (tracked in the dotclaude repo) from the
# plugin manifest, using relative targets so the committed links carry no
# username. Both tools then name only that stable path via skills.paths.
description = "Rewrite ~/.claude/fleet-skills/ symlinks from ~/.claude/plugins/installed_plugins.json so opencode and kilo see current plugin skills. Repairs; run check-fleet-skills to only report."
run = '''
#!/usr/bin/env bash
set -euo pipefail

DOTFILES_ROOT="${MISE_DOTFILES_ROOT:-${DOTFILES_ROOT:-$HOME/.dotfiles}}"
SCRIPT="$DOTFILES_ROOT/scripts/sync-fleet-skills.sh"

if [ ! -f "$SCRIPT" ]; then
    echo "sync-fleet-skills: $SCRIPT not found. Run \`mise bootstrap dotfiles apply\` first." >&2
    exit 1
fi

exec "$SCRIPT" "$@"
'''

[tasks.check-fleet-skills]
# Alert-only half of sync-fleet-skills, same split as check-adhd-themes:
# reports every drifted link with its path and exits 1, never writes. The
# same script runs in --tracked-only mode from the global pre-commit hook,
# so neither a dropped skills.paths entry nor an absolute or dangling
# committed symlink can land in dotfiles or dotclaude.
description = "Verify ~/.claude/fleet-skills/ matches the installed plugins and that kilo + opencode both declare skills.paths. Alerts only; exits 1 with the broken path. Repair with sync-fleet-skills."
run = '''
#!/usr/bin/env bash
set -euo pipefail

DOTFILES_ROOT="${MISE_DOTFILES_ROOT:-${DOTFILES_ROOT:-$HOME/.dotfiles}}"
SCRIPT="$DOTFILES_ROOT/scripts/sync-fleet-skills.sh"

if [ ! -f "$SCRIPT" ]; then
    echo "check-fleet-skills: $SCRIPT not found. Run \`mise bootstrap dotfiles apply\` first." >&2
    exit 1
fi

exec "$SCRIPT" --check "$@"
'''

[tasks.check-mise-secrets]
# One-time (so far) breakage: a stray line in the secrets env files mise
# auto-loads crashed every mise command. Verifies every .env under
# $XDG_RUNTIME_DIR/secrets/ parses as dotenv. Runtime-only (the secrets dir
# isn't in the repo) so it has no --tracked-only mode. The lasting fix is
# validation in secrets-unlock before writing the runtime file; this is the
# standing backstop.
description = "Verify mise auto-loaded secrets env files ($XDG_RUNTIME_DIR/secrets/*.env) parse as dotenv. Alerts only; exits 1 with the broken file:line. Skips if secrets not unlocked."
run = '''
#!/usr/bin/env bash
set -euo pipefail

DOTFILES_ROOT="${MISE_DOTFILES_ROOT:-${DOTFILES_ROOT:-$HOME/.dotfiles}}"
SCRIPT="$DOTFILES_ROOT/scripts/check-mise-secrets.sh"

if [ ! -f "$SCRIPT" ]; then
    echo "check-mise-secrets: $SCRIPT not found. Run \`mise bootstrap dotfiles apply\` first." >&2
    exit 1
fi

exec "$SCRIPT" "$@"
'''

[tasks.install-worktree-githooks]
description = "Install worktree-githooks template (post-checkout hook that symlinks node_modules / runs uv sync) to ~/.config/git/hooks and set global core.hooksPath. Globally available via `mise run install-worktree-githooks` from any directory. Idempotent: clones or pulls jeremysball/worktree-githooks, copies hook, sets hooksPath."
run = '''
#!/usr/bin/env bash
set -euo pipefail

REPO_DIR="$HOME/projects/worktree-githooks"
HOOK_SRC=".githooks/post-checkout"
GLOBAL_HOOKS="$HOME/.config/git/hooks"

mkdir -p "$HOME/projects" "$GLOBAL_HOOKS"

if [ -d "$REPO_DIR/.git" ]; then
  echo "install-worktree-githooks: pulling $REPO_DIR"
  git -C "$REPO_DIR" pull --ff-only
else
  if [ -d "$REPO_DIR" ]; then
    echo "install-worktree-githooks: $REPO_DIR exists but not a git repo, skipping clone" >&2
  else
    git clone https://github.com/jeremysball/worktree-githooks.git "$REPO_DIR"
  fi
fi

if [ ! -f "$REPO_DIR/$HOOK_SRC" ]; then
  echo "install-worktree-githooks: $REPO_DIR/$HOOK_SRC not found" >&2
  exit 1
fi

cp "$REPO_DIR/$HOOK_SRC" "$GLOBAL_HOOKS/post-checkout"
chmod +x "$GLOBAL_HOOKS/post-checkout"
git config --global core.hooksPath "$GLOBAL_HOOKS"

echo "install-worktree-githooks: installed $GLOBAL_HOOKS/post-checkout and set global core.hooksPath=$GLOBAL_HOOKS"
echo "install-worktree-githooks: per-repo override still works: cp $REPO_DIR/$HOOK_SRC .githooks/post-checkout && git config core.hooksPath .githooks"
'''


[tasks.install-githooks]
# core.hooksPath is single-valued and repo-local beats global, with no
# merging, so a repo that sets `core.hooksPath = .githooks` for contributor
# portability silently disables every global hook on this machine. Measured
# 2026-09-01: sixteen repos set the override, none carried the global
# em-dash gate, so that gate had never fired on a commit in any of them.
# This installs a shim that runs the global hook first, then the repo's own.
description = "Wire a repo's .githooks/ to chain the global hooks in ~/.config/git/hooks, so a repo-local core.hooksPath stops shadowing them. Preserves an existing repo hook as <hook>.local. Idempotent. Usage: mise run install-githooks [repo-path...] (defaults to cwd)."
run = '''
#!/usr/bin/env bash
set -euo pipefail

DOTFILES_ROOT="${MISE_DOTFILES_ROOT:-${DOTFILES_ROOT:-$HOME/.dotfiles}}"
SCRIPT="$DOTFILES_ROOT/scripts/install-githooks.sh"

if [ ! -f "$SCRIPT" ]; then
    echo "install-githooks: $SCRIPT not found. Run \`mise bootstrap dotfiles apply\` first." >&2
    exit 1
fi

exec "$SCRIPT" "$@"
'''

[tasks.sync-git-bin]
# git only finds subcommands on PATH, but the git-* helpers live as scripts
# in the dotclaude repo (~/.claude/scripts/) and in this repo's scripts/.
# Measured 2026-09-03: git-mainsync existed for weeks with nothing linking it
# into ~/.local/bin, so every `git mainsync main` failed with "not a git
# command" and the CLAUDE.md rule silently fell through to its manual
# fallback. This links them. Idempotent: repoints a stale link, refuses to
# overwrite a real file.
description = "Symlink git-* helper scripts into ~/.local/bin so git subcommands resolve. Idempotent; refuses to overwrite real files."
run = '''
#!/usr/bin/env bash
set -euo pipefail

DST_DIR="$HOME/.local/bin"
DOTFILES_ROOT="${MISE_DOTFILES_ROOT:-${DOTFILES_ROOT:-$HOME/.dotfiles}}"

link_one() {
    local src="$1" dst="$DST_DIR/$2"
    if [ ! -e "$src" ]; then
        echo "sync-git-bin: source $src not found" >&2
        return 1
    fi
    if [ -e "$dst" ] && [ ! -L "$dst" ]; then
        echo "sync-git-bin: $dst exists and is not a symlink, refusing to overwrite" >&2
        return 1
    fi
    mkdir -p "$DST_DIR"
    ln -sfn "$src" "$dst"
    echo "sync-git-bin: $dst -> $src"
}

link_one "$HOME/.claude/scripts/git-mainsync" git-mainsync
link_one "$DOTFILES_ROOT/scripts/git-lane" git-lane
'''

[tasks.check-claude-md]
# Alert-only half of the Tier 1 mechanization: the "Maintaining this file"
# cap (50 rules, 600 lines) as a runnable gate instead of a paragraph. The
# repair is the Tier 1 trim itself; this task only reports. Run it before
# adding a rule: a new rule must fit the budget or displace something else.
description = "Verify a CLAUDE.md is within budget (<=50 ## rules, <=600 lines). Alerts only; exits 1 with the offending numbers. Usage: mise run check-claude-md [path] (default ~/.claude/CLAUDE.md)."
run = '''
#!/usr/bin/env bash
set -euo pipefail

DOTFILES_ROOT="${MISE_DOTFILES_ROOT:-${DOTFILES_ROOT:-$HOME/.dotfiles}}"
SCRIPT="$DOTFILES_ROOT/scripts/check-claude-md.sh"

if [ ! -f "$SCRIPT" ]; then
    echo "check-claude-md: $SCRIPT not found. Run \`mise bootstrap dotfiles apply\` first." >&2
    exit 1
fi

exec "$SCRIPT" "$@"
'''
